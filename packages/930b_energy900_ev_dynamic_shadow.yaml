# Energy900 EV dynamic v0.1.3-shadow
# Home + connected + SOC below 80% arms cheap-slot top-up to 90%.
# Helper automation only tracks shadow intent; no Easee or Zendure calls.
input_boolean:
  energy900_ev_dynamic_topup_armed:
    name: Energy900 EV goedkoop bijladen tot 90 shadow
    icon: mdi:battery-clock-outline

automation:
  - id: energy900_ev_dynamic_topup_shadow_latch
    alias: Energy900 EV dynamisch bijlaadverzoek shadow
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - device_tracker.ev6_location
          - binary_sensor.ev_aangesloten
          - sensor.ev_actuele_voertuig_soc
    actions:
      - choose:
          - conditions: >-
              {{ is_state('device_tracker.ev6_location','home')
                 and is_state('binary_sensor.ev_aangesloten','on')
                 and is_number(states('sensor.ev_actuele_voertuig_soc'))
                 and states('sensor.ev_actuele_voertuig_soc')|float < 80 }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.energy900_ev_dynamic_topup_armed
          - conditions: >-
              {{ not is_state('device_tracker.ev6_location','home')
                 or not is_state('binary_sensor.ev_aangesloten','on')
                 or not is_number(states('sensor.ev_actuele_voertuig_soc'))
                 or states('sensor.ev_actuele_voertuig_soc')|float >= 90 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.energy900_ev_dynamic_topup_armed

template:
  - sensor:
      - name: Energy900 EV Dynamic Shadow Plan
        unique_id: energy900_ev_dynamic_shadow_plan
        icon: mdi:calendar-clock
        state: >-
          {% set armed=is_state('input_boolean.energy900_ev_dynamic_topup_armed','on') %}
          {% set soc=states('sensor.ev_actuele_voertuig_soc') %}
          {% set src=states('input_text.dynamic_price_market_source_entity') %}
          {% set slots=(state_attr(src,'raw_today')|default([],true))+(state_attr(src,'raw_tomorrow')|default([],true)) %}
          {% set vat=states('input_number.dynamic_contract_vat_factor')|float(0) %}
          {% set tax=states('input_number.dynamic_contract_energy_tax')|float(0) %}
          {% set fee=states('input_number.dynamic_contract_import_supplier_fee')|float(0) %}
          {% set ceiling=states('input_number.ev_dynamisch_goedkoop_max_eur_kwh')|float(-999) %}
          {% set ns=namespace(count=0) %}
          {% for slot in slots %}
            {% if as_timestamp(slot.end,0)>as_timestamp(now()) and is_number(slot.value)
              and slot.value|float*vat+tax+fee<=ceiling %}
              {% set ns.count=ns.count+1 %}
            {% endif %}
          {% endfor %}
          {% if not is_state('device_tracker.ev6_location','home')
            or not is_state('binary_sensor.ev_aangesloten','on') %}waiting_for_home_and_cable
          {% elif not is_number(soc) %}soc_invalid
          {% elif soc|float>=90 %}target_90_reached
          {% elif not armed %}waiting_for_soc_below_80
          {% elif not is_state('binary_sensor.dynamic_price_contract_canonical_healthy','on')
            or not is_number(states('input_number.dynamic_contract_vat_factor'))
            or not is_number(states('input_number.dynamic_contract_energy_tax'))
            or not is_number(states('input_number.dynamic_contract_import_supplier_fee'))
            or not is_number(states('input_number.ev_dynamisch_goedkoop_max_eur_kwh')) %}price_invalid
          {% elif ns.count==0 %}no_cheap_slots_known
          {% else %}cheap_topup_to_90_candidate{% endif %}
        attributes:
          version: v0.1.3-shadow
          physical_write: false
          start_soc_below_pct: 80
          stop_soc_at_pct: 90
          topup_armed: "{{ states('input_boolean.energy900_ev_dynamic_topup_armed') }}"
          current_soc_pct: "{{ states('sensor.ev_actuele_voertuig_soc') }}"
          price_ceiling_eur_kwh: "{{ states('input_number.ev_dynamisch_goedkoop_max_eur_kwh') }}"
          phase_assumption: one_phase_16a_energy_diagnostic_only
          estimated_grid_need_kwh: >-
            {% set soc=states('sensor.ev_actuele_voertuig_soc') %}
            {% set cap=states('input_number.ev_accucapaciteit_kwh') %}
            {% set loss=states('input_number.ev_laadverlies_percentage') %}
            {{ ((90-soc|float)*cap|float/100/(1-loss|float/100))|round(2)
              if is_number(soc) and is_number(cap) and is_number(loss)
              and soc|float<90 and 0<=loss|float<100 else 0 }}
          estimated_quarters_one_phase: >-
            {% set soc=states('sensor.ev_actuele_voertuig_soc') %}
            {% set cap=states('input_number.ev_accucapaciteit_kwh') %}
            {% set loss=states('input_number.ev_laadverlies_percentage') %}
            {% set amps=states('input_number.ev_maximale_laadstroom_tijdelijk') %}
            {% set voltage=states('sensor.ev_netspanning') %}
            {% set need=(90-soc|float)*cap|float/100/(1-loss|float/100)
              if is_number(soc) and is_number(cap) and is_number(loss)
              and soc|float<90 and 0<=loss|float<100 else 0 %}
            {% set each=voltage|float*[amps|float,16]|min/4000
              if is_number(voltage) and is_number(amps) else 0 %}
            {{ (need/each)|round(0,'ceil')|int if need>0 and each>0 else 0 }}
          selected_blocks: >-
            {% set src=states('input_text.dynamic_price_market_source_entity') %}
            {% set slots=(state_attr(src,'raw_today')|default([],true))+(state_attr(src,'raw_tomorrow')|default([],true)) %}
            {% set vat=states('input_number.dynamic_contract_vat_factor')|float(0) %}
            {% set tax=states('input_number.dynamic_contract_energy_tax')|float(0) %}
            {% set fee=states('input_number.dynamic_contract_import_supplier_fee')|float(0) %}
            {% set ceiling=states('input_number.ev_dynamisch_goedkoop_max_eur_kwh')|float(-999) %}
            {% set ns=namespace(items=[]) %}
            {% if is_state('input_boolean.energy900_ev_dynamic_topup_armed','on')
              and is_state('device_tracker.ev6_location','home')
              and is_state('binary_sensor.ev_aangesloten','on')
              and is_state('binary_sensor.dynamic_price_contract_canonical_healthy','on')
              and is_number(states('input_number.ev_dynamisch_goedkoop_max_eur_kwh')) %}
              {% for slot in slots %}
                {% set price=slot.value|float(999)*vat+tax+fee %}
                {% if as_timestamp(slot.end,0)>as_timestamp(now())
                  and is_number(slot.value) and price<=ceiling %}
                  {% set ns.items=ns.items+[dict(start=slot.start.isoformat(),
                    end=slot.end.isoformat(),price_eur_kwh=price|round(5))] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ (ns.items|sort(attribute='start')|list)|to_json }}
          limitation: all_known_cheap_blocks_are_candidates_energy_estimate_diagnostic_only

      - name: Energy900 EV Dynamic Shadow Proposal
        unique_id: energy900_ev_dynamic_shadow_proposal
        unit_of_measurement: A
        device_class: current
        state: >-
          {% set raw=state_attr('sensor.energy900_ev_dynamic_shadow_plan','selected_blocks') %}
          {% set blocks=raw if raw is sequence and raw is not string else raw|from_json([]) %}
          {% set ns=namespace(active=false) %}
          {% for slot in blocks %}
            {% if as_timestamp(slot.start,0)<=as_timestamp(now())<as_timestamp(slot.end,0) %}
              {% set ns.active=true %}
            {% endif %}
          {% endfor %}
          {% set cap=states('sensor.ev_netbalancer_safe_current') %}
          {% set maximum=states('input_number.ev_maximale_laadstroom_tijdelijk') %}
          {% set soc=states('sensor.ev_actuele_voertuig_soc') %}
          {% if not is_state('binary_sensor.ev_aangesloten','on') or not is_number(soc)
            or soc|float>=100 or not is_number(cap) or not is_number(maximum)
            or states('sensor.energy900_grid_shadow_status') in
              ['unknown','unavailable','phase_current_invalid','p1_heartbeat_stale'] %}
            0
          {% else %}
            {% set limit=[cap|int(0),maximum|int(0),16]|min %}
            {% set override=is_state('timer.ev_laad_override','active') %}
            {% set urgent=states('sensor.ev_beslis_engine_v2_laadmodus') in ['URGENT','NOW'] %}
            {% set pv=is_state('sensor.ev_beslis_engine_v2_laadmodus','PV_FIRST')
              and is_state('input_boolean.ev600_pv_shortage_block','off') %}
            {% set age=states('sensor.ev6_data_age_sec') %}
            {% set active_ev=is_state('sensor.euj3mext_status','charging')
              or states('sensor.euj3mext_vermogen')|float(0)>1 %}
            {% set cheap_soc_fresh=is_number(age) and age|float >= 0
              and age|float <= (900 if active_ev else 300) %}
            {% set request=states('input_number.ev_override_laadstroom_a')|int(0) if override
              else maximum|int(0) if urgent or
                (is_state('sensor.energy900_ev_dynamic_shadow_plan','cheap_topup_to_90_candidate') and ns.active and cheap_soc_fresh)
              else states('sensor.ev600_pv_linear_request')|int(0) if pv else 0 %}
            {{ [request,limit]|min if request>=6 and limit>=6 else 0 }}
          {% endif %}
        attributes:
          version: v0.1.3-shadow
          physical_write: false
          policy: home_soc_below_80_cheap_blocks_topup_to_90
          battery_policy_during_ev_charge: no_discharge_zendure_controls_charge
          plan_status: "{{ states('sensor.energy900_ev_dynamic_shadow_plan') }}"
          kia_soc_age_s: "{{ states('sensor.ev6_data_age_sec') }}"
          kia_refresh_policy: reuse_existing_button_ev6_force_refresh_route
          cheap_topup_needs_refresh: >-
            {% set age=states('sensor.ev6_data_age_sec') %}
            {% set active_ev=is_state('sensor.euj3mext_status','charging')
              or states('sensor.euj3mext_vermogen')|float(0)>1 %}
            {{ not is_number(age) or age|float<0
              or age|float>(900 if active_ev else 300) }}
          observed_battery_discharge_w: "{{ states('sensor.battery_discharge_power') }}"
          existing_gateway_a: "{{ states('sensor.ev600_gateway_selected_current') }}"

      - name: Energy900 EV Dynamic Shadow Comparison
        unique_id: energy900_ev_dynamic_shadow_comparison
        state: >-
          {% set old=states('sensor.ev600_gateway_selected_current') %}
          {% set new=states('sensor.energy900_ev_dynamic_shadow_proposal') %}
          {% if not is_number(old) or not is_number(new) %}invalid
          {% elif (old|float-new|float)|abs<=0.5 %}match
          {% else %}different{% endif %}
        attributes:
          physical_write: false
          candidate_a: "{{ states('sensor.energy900_ev_dynamic_shadow_proposal') }}"
          existing_gateway_a: "{{ states('sensor.ev600_gateway_selected_current') }}"
          existing_gateway_source: "{{ states('sensor.ev600_gateway_selected_source') }}"
